name: Test and deploy Saola Gomoku
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      # The two exhaustive board-size/complete-match matrices are available
      # in full-regression.yml; deployment still tests rules, tactics, UCT,
      # Swap2, lifecycle and the compiled browser interface on every push.
      - run: npm run test:smoke
      - run: npm run build
        env:
          SAOLA_DIST_BASE_URL: /saola-gomoku/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          SAOLA_DIST_BASE_URL: /saola-gomoku/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
